<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#c99738" />
      <stop offset="100%" stop-color="#8c6418" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c99738" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8" />

  <!-- Geometric Luxury Diamond / Safari Compass Star -->
  <g transform="translate(256, 256)">
    <!-- Back Diamond -->
    <path d="M 0 -130 L 130 0 L 0 130 L -130 0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />
    
    <!-- Inner Compass / Triangle / Pyramid Silhouette -->
    <polygon points="0,-105 85,90 -85,90" fill="url(#goldGrad)" />
    
    <!-- Inner Cut / Modern Stylized Detail -->
    <polygon points="0,-50 45,70 -45,70" fill="#0b1220" />
    
    <!-- Central North Star Point -->
    <circle cx="0" cy="18" r="14" fill="url(#goldGrad)" />
  </g>
  
  <!-- Lettermark / Brand Text -->
  <text x="256" y="445" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="10">VELUNTU</text>
</svg>
